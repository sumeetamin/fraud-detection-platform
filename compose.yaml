services:
  fraud-api:
    build: .
    command: ["uvicorn", "fraud.api:app", "--host", "0.0.0.0", "--port", "8003"]
    env_file:
      - .env
    ports:
      - "8003:8003"
    volumes:
      - fraud-runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fraud-runtime:
